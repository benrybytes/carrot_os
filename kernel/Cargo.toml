[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
resolver = "2"

exclude = ["vga_text.rs"]


[dependencies]
volatile = "0.2.6"
x86_64 = { git = "https://github.com/rust-osdev/x86_64", branch = "next", features=["abi_x86_interrupt"] }
linked_list_allocator = "0.9.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
limine = "0.5.0"
acpi = "6.0.1"
atomic_enum = "0.3.0"
bitflags = "2.9.4"
either = { version = "1.15.0", default-features = false }
elf = { version = "0.8.0", default-features = false }
embedded-graphics = "0.8.1"
ez_paging = { git = "https://github.com/ChocolateLoverRaj/ez_paging", version = "0.1.0", default-features = false }
force-send-sync = { git = "https://github.com/ChocolateLoverRaj/force-send-sync", branch = "no_std", version = "1.1.0" }
log = "0.4.27"
nodit = { version = "0.9.2", default-features = false }
num_enum = { version = "0.7.4", default-features = false }
owo-colors = "4.2.1"
spin = "0.10.0"
talc = "4.4.3"
uart = { git = "https://github.com/ChocolateLoverRaj/uart", branch = "send-sync", version = "2.0.0" }
uart_16550 = "0.3.2"
unicode-segmentation = "1.12.0"
x2apic = { git = "https://github.com/ChocolateLoverRaj/x2apic-rs", version = "0.5.0" }


# OnceCell uninitialization
[dependencies.crossbeam-queue]
version = "=0.3.11"
default-features = false
features = ["alloc"]

# used for initializing static once
[dependencies.conquer-once]
version = "^0.2.0"
default-features = false

# types for polling streams
[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# make panic exit the program instead of stack unwinding
# [profile.dev]
# panic = "abort"
#
# [profile.release]
# panic = "abort"

[unstable]
panic-abort-tests = true

[package.metadata.bootimage]
# size of base and size are IO port for data bus
# peripheral hardware: port number of devices in an address
# isa-debug-exit: simple first bit check for error handling
# serial allows printing to device
test-args = [
	"-device", "isa-debug-exit,iobase=0xf4,iosize=0x4", 
	"-serial", "stdio", "-display", "none"]
test-success-exit-code = 33 # (0x10 << 1) | 1;

# treat tests as normal executables
[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
